name: build-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project CourseShell.xcodeproj \
            -scheme CourseShell \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/CourseShell.app out/Payload/
          cd out && zip -qry CourseShell.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CourseShell-ipa
          path: ios/out/CourseShell.ipa
          if-no-files-found: error
